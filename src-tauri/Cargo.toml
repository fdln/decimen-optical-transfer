[package]
name = "decimen-desktop"
version = "0.5.3"
description = "Desktop shell for Decimen Optical Transfer: fountain-coded animated QR file transfer, screen to camera, no network."
license = "AGPL-3.0-or-later"
repository = "https://github.com/bashalarmistalt/decimen-optical-transfer"
edition = "2021"
publish = false

[lib]
name = "decimen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
