name: Desktop (Windows)

# Builds the Tauri shell (src-tauri/) into a Windows installer and keeps it as
# a workflow artifact. A green run proves the installer builds — nothing here
# launches it, so the camera and Scan screen in WebView2 still need a person
# at a Windows machine. See docs/technical/desktop.md.
#
# No pull_request trigger on purpose: a PR would spend a long Windows job in
# the Actions of whichever repository receives it.

on:
  push:
    # Branches only — without this a pushed tag would start a build as well.
    branches: ["**"]
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only the newest run per branch matters; cancel the rest.
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners check out with CRLF by default; the i18n build compares
      # the pages' inline English against LF catalog strings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The runner image ships rustup with the stable MSVC toolchain.
      - run: rustc --version && cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: desktop-windows-cargo-
      - run: npm ci
      # The restored cache may hold an installer from an earlier version; the
      # upload below would pick it up alongside the new one.
      - run: rm -rf src-tauri/target/release/bundle
      # tauri.conf.json lists the macOS targets; the bundle is chosen here so
      # that file stays as verified. npx rather than `npm run tauri -- …`:
      # forwarding arguments through npm on Windows is unreliable.
      - run: npx tauri build --bundles nsis
      - name: List what was built
        run: ls -la src-tauri/target/release/bundle/nsis
      - uses: actions/upload-artifact@v4
        with:
          name: decimen-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
